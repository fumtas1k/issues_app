name: Test

on:
  pull_request:
    types: [ opened, labeled, synchronize, reopened ]

env:
  RAILS_ENV: test
  ISSUES_APP_DATABASE_PASSWORD: issues_app
  DATABASE_URL: postgresql://issues_app:issues_app@localhost:5432/issues_app_test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rspec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: issues_app
          POSTGRES_PASSWORD: issues_app
          POSTGRES_DB: issues_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler: "Gemfile.lock"
          bundler-cache: true
      - name: Install Fonts
        run: sudo locale-gen ja_JP.UTF-8 && sudo apt-get install fonts-ipafont-gothic fonts-ipafont-mincho
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 16
          cache: yarn
      - name: Cache Yarn
        # setup-nodeのcacheではnode_modulesはキャッシュされない
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: yarn-v1-${{ hashFiles('yarn.lock') }}
      - name: Yarn install
        run: yarn
      - name: Setup DB
        run: bundle exec rails db:schema:load
      - name: Rspec
        run: bundle exec rspec
